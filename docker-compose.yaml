services:
  app:
    build: .
    container_name: capturefraud-app
    working_dir: /app
    volumes:
      - .:/app
    environment:
      - PYTHONPATH=/app
    ports:
      - "8000:8000"
      - "4040:4040"
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: capturefraud-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    command: npm run dev -- --host

  jupyter:
    build: .
    container_name: capturefraud-jupyter
    working_dir: /app
    volumes:
      - .:/app
    environment:
      - PYTHONPATH=/app
    ports:
      - "8888:8888"
      - "4041:4040"
    command: >
      jupyter lab
      --ip=0.0.0.0
      --allow-root
      --no-browser
      --ServerApp.token=fraud123
      --ServerApp.password=
    profiles:
      - jupyter
